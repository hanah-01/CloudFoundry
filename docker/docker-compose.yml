services:
  localstack:
    image: localstack/localstack:3.0
    container_name: localstack
    networks:
      - devopsnet
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
      - "8080:8080"
    environment:
      - SERVICES=ec2,s3,iam,vpc,sts,lambda,dynamodb,cloudwatch,logs,apigateway

      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=0
      - PERSISTENCE=1
      - LOCALSTACK_WEB=1
      - LOCALSTACK_WEB_PORT=8080
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init-scripts:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  jenkins:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/workspace
    networks:
      - devopsnet

volumes:
  localstack_data:
    driver: local
  jenkins_home:
    driver: local

networks:
  devopsnet:
    driver: bridge
