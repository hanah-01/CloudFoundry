# ============================================================
# hosts.ini  –  Ansible inventory
#
# Replace <EC2_PUBLIC_IP> with the actual IP printed by
# `terraform output web_server_public_ip` after apply.
# For LocalStack the IP may be 127.0.0.1.
# ============================================================

[webservers]
web01 ansible_host=<EC2_PUBLIC_IP> ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/lab-key.pem

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3

