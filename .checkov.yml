framework:
  - terraform

directory:
  - terraform

# Review and remove skips for production workloads.
skip-check:
  - CKV_AWS_8    # "Ensure IMDSv2 is enabled" – not applicable to LocalStack
  - CKV_AWS_79   # "Ensure Instance Metadata Service Version 1 is not enabled" – LocalStack
  - CKV2_AWS_12  # "Ensure the default security group of every VPC restricts all traffic" – lab

output: cli
compact: false
quiet: false

# Fail the scan when a check of this severity or higher is found.
# Set to "NONE" to never fail (report only).
# Options: CRITICAL | HIGH | MEDIUM | LOW | NONE
soft-fail-on:
  - LOW
  - MEDIUM