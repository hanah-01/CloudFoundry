# ============================================================
# terraform-plan.yml
# Runs on every Pull Request that touches terraform/** files.
# Runs: init → format-check → validate → tfsec → checkov → plan
# Posts plan output as a PR comment.
# ============================================================

name: Terraform PR Plan & Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents:      read
  pull-requests: write  # needed to post plan comment

env:
  TF_VERSION:  "1.7.0"
  TF_WORK_DIR: "./terraform"

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Terraform Validate & Plan
  # ─────────────────────────────────────────────────────────
  terraform-plan:
    name: "Terraform Init / Validate / Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Start LocalStack ───────────────────────────────────
      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: "latest"
          install-awslocal: "true"

      # ── Setup Terraform CLI ───────────────────────────────
      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Format check ─────────────────────────────────────
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORK_DIR }}
        continue-on-error: true   # report but don't fail the PR

      # ── Init ─────────────────────────────────────────────
      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORK_DIR }}

      # ── Validate ─────────────────────────────────────────
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORK_DIR }}

      # ── Plan ─────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan \
            -var="environment=dev" \
            2>&1 | tee plan_output.txt
        working-directory: ${{ env.TF_WORK_DIR }}
        continue-on-error: true

      # ── Post plan as PR comment ───────────────────────────
      - name: Post Plan to Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORK_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const planTruncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + "\n...[truncated]"
              : plan;

            const output = `## Terraform Plan 📋
            | Step            | Result |
            |-----------------|--------|
            | Format check    | \`${{ steps.fmt.outcome }}\`      |
            | Init            | \`${{ steps.init.outcome }}\`     |
            | Validate        | \`${{ steps.validate.outcome }}\` |
            | Plan            | \`${{ steps.plan.outcome }}\`     |

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${planTruncated}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }} · Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         output
            });

      # ── Fail job if plan failed ───────────────────────────
      - name: Check Plan Result
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────
  # 2. Security Scanning (tfsec + Checkov)
  # ─────────────────────────────────────────────────────────
  security-scan:
    name: "IaC Security Scan"
    runs-on: ubuntu-latest
    needs: terraform-plan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── tfsec ─────────────────────────────────────────────
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORK_DIR }}
          soft_fail: true           # report findings but don't block PR
          format: sarif
          additional_args: "--no-colour"

      # ── Checkov ───────────────────────────────────────────
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory:    ${{ env.TF_WORK_DIR }}
          framework:    terraform
          soft_fail:    true
          output_format: cli
